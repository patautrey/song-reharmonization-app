<script>
        const harmonicDefinitions = {
            "Tritone Substitution": "Replacing a dominant 7th chord with another dominant 7th chord whose root is a tritone (augmented 4th) away. Both share the same tritone interval guide tones, creating smooth chromatic bass motion (e.g., G7 to Db7 resolving to C).",
            "Secondary Dominants": "A dominant 7th chord that resolves to a diatonic scale degree other than the tonic (e.g., V7/ii, V7/V). It temporarily tonicizes a target chord, adding strong directional pull.",
            "Chromatic Dominants": "Dominant chord qualities moved in parallel or chromatic steps outside the home key signature to add sudden harmonic color and tension before resolving.",
            "Backdoor Dominant": "A subdominant-functioning dominant chord built on the flat-VII (bVII7) that resolves directly to the tonic major chord (e.g., Bb7 to Cmaj7), bypassing standard V-I motion.",
            "Modal Parallel Borrowing": "Borrowing chords from parallel modes (such as minor mode iv, bVI, or bVII into a major key context) to enrich emotional color without shifting tonal center.",
            "Planing / Parallelism": "Moving a chord structure (such as triads or seventh chords) in parallel motion up or down the scale regardless of diatonic scale steps, common in impressionist harmony.",
            "Poly Chords": "Superimposing two distinct triad or seventh chord structures simultaneously (e.g., D triad over a C major triad) to build dense, rich upper structure textures.",
            "Upper Structures": "Voicing triads derived from upper extensions (such as 9th, #11, or 13th) over a lower dominant bass and shell voicing to achieve modern jazz piano and guitar voicings.",
            "Drop 2 Voicing": "A foundational chord voicing method where the second note from the top of a closed-position chord is dropped an octave down, opening up the voicing for guitars and keyboards.",
            "Diminished Passing Chords": "Fully diminished 7th chords inserted stepwise between two diatonic chords to smooth out root movement and create chromatic connective tissue.",
            "Diatonic Substitution": "Replacing a chord with another diatonic chord sharing similar harmonic function (e.g., substituting ii for IV, or iii for I) to maintain stability while altering color.",
            "Relative Chord Intercept": "Inserting a relative minor or major chord into a standard progression to interrupt expected cadential expectations and create fresh melodic pathways.",
            "Harmonic Prolongation": "Stretching out a single harmonic function over multiple beats or measures using pedal points, neighboring chords, or inversions without altering the core functional harmony.",
            "Pedal Tones": "Holding a single bass note (usually Tonic or Dominant) constant while upper harmony changes across multiple chords, generating delicious suspense and resolution.",
            "Bass Walk-Ups": "Stepping the bass line upward stepwise (often using quarter notes or half notes) from one chord root to the next through chromatic or diatonic passing tones.",
            "Bass Walk-Downs": "Stepping the bass line downward stepwise between chords to create smooth counterpoint and melodic momentum in the low end.",
            "Inversions (Slash Chords)": "Placing a chord tone other than the root in the bass (e.g., C/E or G/B) to create smoother stepwise bass lines and softer harmonic transitions.",
            "Non-Chord Tones": "Melodic decorations such as suspensions, appoggiaturas, passing tones, and neighbor tones that temporarily create dissonance against the underlying chord.",
            "Circle of 5ths Cycle": "A classic root progression moving downward by fifths (or upward by fourths), providing the strongest natural gravitational pull in Western tonal music.",
            "Standard Turnaround": "A short chord progression at the end of a section (such as I - vi - ii - V) that cycles back smoothly to the beginning of the form.",
            "ii-V-I & ii°-V7-i Cadences": "The fundamental jazz and classical cadential building block establishing tonal centers in both major and minor keys through pre-dominant, dominant, and tonic resolution.",
            "iii-vi-ii-V-I Extended Chain": "An extended descending cycle connecting diatonic functional harmonies to create a lush, rolling harmonic runway into the tonic chord.",
            "Andalusian Progression": "A descending tetrachord progression (e.g., Am - G - F - E) famous in flamenco, Spanish guitar, and classic rock anthems.",
            "Extensions (9ths, 11ths, 13ths)": "Adding higher stack intervals above seventh chords to provide sophisticated harmonic color, depth, and jazz vocabulary.",
            "Suspended (sus4 / sus2)": "Replacing the 3rd of a chord with the 4th or 2nd scale degree, creating an open, suspended tension that yearns to resolve back to the chord tone.",
            "Perfect Authentic Cadence": "The ultimate harmonic punctuation mark: V7 resolving to I in root position with the tonic note in the highest soprano voice.",
            "Plagal Cadence (Amen Close)": "The IV resolving directly to I, offering a warm, uplifting, and hymn-like cadence resolution.",
            "Half Cadence Break": "Ending a phrase on the dominant chord (V), leaving the musical sentence deliberately open and hanging in suspense.",
            "Figured Bass: 6 (Root Triad Inv)": "First inversion triad (third in the bass), historically denoted by the figure 6 indicating a sixth interval above the bass note.",
            "Figured Bass: 6/4 (Second Inv)": "Second inversion triad (fifth in the bass), denoted by figures 6 and 4, typically requiring careful resolution.",
            "Figured Bass: 4/3 (7th Chord 2nd Inv)": "Seventh chord in second inversion (fifth in the bass), combining a fourth and third interval structure above the bass.",
            "Figured Bass: 5/2 (7th Chord 3rd Inv)": "Seventh chord in third inversion (seventh in the bass), with the seventh placed in the lowest voice demanding immediate downward resolution."
        };

        const sectionData = {
            'INTRO': [
                { m: 1, base: 'G', reharm: 'G', roman: 'I' },
                { m: 2, base: 'Em', reharm: 'Em', roman: 'vi' },
                { m: 3, base: 'C', reharm: 'C', roman: 'IV' },
                { m: 4, base: 'D', reharm: 'D', roman: 'V' }
            ],
            'VERSE 1': [
                { m: 1, base: 'G', reharm: 'Gmaj7', roman: 'Imaj7' },
                { m: 2, base: 'Bm', reharm: 'Bm7', roman: 'iiim7' },
                { m: 3, base: 'C', reharm: 'Cmaj9', roman: 'IVmaj9' },
                { m: 4, base: 'D7', reharm: 'D9', roman: 'V9' }
            ],
            'VERSE 2': [
                { m: 1, base: 'G', reharm: 'G6', roman: 'I6' },
                { m: 2, base: 'Bm', reharm: 'Bm9', roman: 'iiim9' },
                { m: 3, base: 'C', reharm: 'Cmaj7', roman: 'IVmaj7' },
                { m: 4, base: 'D7', reharm: 'D13', roman: 'V13' }
            ],
            'PRE-CHORUS': [
                { m: 1, base: 'Am', reharm: 'Am9', roman: 'iim9' },
                { m: 2, base: 'D', reharm: 'D7alt', roman: 'V7alt' },
                { m: 3, base: 'G', reharm: 'Gmaj7', roman: 'Imaj7' },
                { m: 4, base: 'E7', reharm: 'E7#9', roman: 'V7/ii' }
            ],
            'CHORUS': [
                { m: 1, base: 'C', reharm: 'Cmaj7', roman: 'IVmaj7' },
                { m: 2, base: 'D', reharm: 'Bm7', roman: 'iiim7' },
                { m: 3, base: 'Em', reharm: 'Cmaj9', roman: 'IVmaj9' },
                { m: 4, base: 'G', reharm: 'Am7', roman: 'iim7' }
            ],
            'BRIDGE': [
                { m: 1, base: 'Am', reharm: 'Fmaj7', roman: 'bVImaj7' },
                { m: 2, base: 'D', reharm: 'Bbmaj7', roman: 'bVIImaj7' },
                { m: 3, base: 'Bm', reharm: 'Ebmaj7', roman: 'bIIImaj7' },
                { m: 4, base: 'Em', reharm: 'Abmaj7', roman: 'bVImaj7' }
            ],
            'OUTRO': [
                { m: 1, base: 'G', reharm: 'Gmaj9', roman: 'Imaj9' },
                { m: 2, base: 'C', reharm: 'Cm6', roman: 'ivm6' },
                { m: 3, base: 'G', reharm: 'Gmaj7', roman: 'Imaj7' },
                { m: 4, base: 'G', reharm: 'G6/9', roman: 'I6/9' }
            ]
        };

        let songArrangement = ['INTRO', 'VERSE 1', 'PRE-CHORUS', 'CHORUS', 'VERSE 2', 'CHORUS', 'BRIDGE', 'CHORUS', 'OUTRO'];
        let currentSection = 'INTRO';
        let selectedMeasureIndex = null;
        let activeAudioElement = null;

        function switchTab(tabName) {
            const workspaceView = document.getElementById('workspace-view');
            const glossaryView = document.getElementById('glossary-view');
            const tabWorkspace = document.getElementById('tab-workspace');
            const tabGlossary = document.getElementById('tab-glossary');

            if (tabName === 'workspace') {
                workspaceView.classList.remove('hidden');
                glossaryView.classList.add('hidden');
                tabWorkspace.classList.add('active');
                tabGlossary.classList.remove('active');
            } else {
                workspaceView.classList.add('hidden');
                glossaryView.classList.remove('hidden');
                tabGlossary.classList.add('active');
                tabWorkspace.classList.remove('active');
            }
        }

        function showDefinition(term) {
            const sidebarPanel = document.getElementById('sidebar-definition');
            const sidebarTitle = document.getElementById('sidebar-def-title');
            const sidebarText = document.getElementById('sidebar-def-text');
            if (harmonicDefinitions[term] && sidebarTitle && sidebarText && sidebarPanel) {
                sidebarTitle.textContent = term;
                sidebarText.textContent = harmonicDefinitions[term];
                sidebarPanel.classList.remove('hidden');
            }
        }

        function selectSection(sectionName) {
            currentSection = sectionName;
            document.querySelectorAll('.section-pill').forEach(pill => {
                if (pill.textContent === sectionName) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            });
            renderMeasures();
        }

        function renderTimeline() {
            const list = document.getElementById('timelineList');
            if (!list) return;
            list.innerHTML = '';
            songArrangement.forEach((sec, idx) => {
                const chip = document.createElement('div');
                chip.className = 'timeline-chip';
                chip.innerHTML = `<span>${idx + 1}. ${sec}</span> <button onclick="removeTimelineSection(${idx})">&times;</button>`;
                list.appendChild(chip);
            });
        }

        function addSectionToTimeline() {
            const select = document.getElementById('addSectionSelect');
            if (select) {
                songArrangement.push(select.value);
                renderTimeline();
            }
        }

        function removeTimelineSection(index) {
            songArrangement.splice(index, 1);
            renderTimeline();
        }

        // --- Verified Custom Progression Jazzifier Function ---
        function generateJazzOptions() {
            const inputElem = document.getElementById('customProgInput');
            const resultsBox = document.getElementById('jazzResultsArea');
            
            if (!inputElem || !resultsBox) return;

            const inputVal = inputElem.value.trim();
            resultsBox.classList.remove('hidden');
            resultsBox.innerHTML = `<strong>Generated Jazz Reharmonization Options for "${inputVal}":</strong>`;

            const variants = [
                { name: "Option 1: Modern Jazz Standard", chords: ["Cmaj9", "Am9", "Dm9", "G13alt"] },
                { name: "Option 2: Tritone & Backdoor Sub", chords: ["Cmaj7", "Eb7", "Db7(subV)", "Cmaj7"] },
                { name: "Option 3: Diminished Passing & Bass", chords: ["C6/9", "C#dim7", "Dm7", "G7(b9)/B"] }
            ];

            variants.forEach((v, vIdx) => {
                let row = document.createElement('div');
                row.className = 'jazz-option-row';
                row.innerHTML = `
                    <span><strong>${v.name}:</strong> ${v.chords.join(' → ')}</span>
                    <button class="btn btn-primary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="loadVariantToCurrentSection(${vIdx})">Load into ${currentSection}</button>
                `;
                resultsBox.appendChild(row);
            });

            window.lastGeneratedVariants = variants;
        }

        function loadVariantToCurrentSection(vIdx) {
            if (!window.lastGeneratedVariants) return;
            const variant = window.lastGeneratedVariants[vIdx];
            const measures = sectionData[currentSection];
            
            if (!measures) return;

            variant.chords.forEach((c, idx) => {
                if (measures[idx]) {
                    measures[idx].reharm = c;
                }
            });

            alert(`Loaded "${variant.name}" into ${currentSection}!`);
            renderMeasures();
        }

        function selectMeasure(idx) {
            selectedMeasureIndex = idx;
            renderMeasures();
            
            const drawer = document.getElementById('paletteDrawer');
            const title = document.getElementById('paletteDrawerTitle');
            const chips = document.getElementById('paletteChips');
            
            if(!drawer || !title || !chips) return;

            title.textContent = `Context-Aware Chord Palette (Measure ${idx + 1} in ${currentSection})`;
            drawer.classList.remove('hidden');
            chips.innerHTML = '';

            let suggestions = ['Cmaj7', 'Am7', 'Fmaj7', 'G7', 'Bm7(b5)', 'E7(#9)', 'Db7(subV)', 'C#dim7', 'G/B'];
            
            suggestions.forEach(sug => {
                let btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = sug;
                btn.onclick = () => {
                    sectionData[currentSection][idx].reharm = sug;
                    renderMeasures();
                };
                chips.appendChild(btn);
            });
        }

        function closePalette() {
            const drawer = document.getElementById('paletteDrawer');
            if (drawer) drawer.classList.add('hidden');
        }

        function runVoiceLeadingAudit() {
            const auditBox = document.getElementById('voiceLeadingAudit');
            if (auditBox) {
                auditBox.innerHTML = `<strong>Voice-Leading Audit:</strong> All intervals and voice motions for '${currentSection}' are clean.`;
                auditBox.style.borderColor = 'var(--accent-green)';
            }
        }

        function renderMeasures() {
            const grid = document.getElementById('measureGrid');
            if (!grid) return;
            grid.innerHTML = '';
            const measures = sectionData[currentSection];

            if (!measures) return;

            measures.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = `measure-card ${selectedMeasureIndex === idx ? 'selected' : ''}`;
                card.onclick = () => selectMeasure(idx);
                card.innerHTML = `
                    <div class="measure-header">
                        <span>M.${m.m}</span>
                        <span>${currentSection}</span>
                    </div>
                    <div class="measure-body">
                        <div>
                            <div class="chord-label">Base</div>
                            <div class="chord-display">${m.base}</div>
                        </div>
                        <div class="chord-slot">
                            <div class="chord-label">Reharm</div>
                            <div class="chord-display" style="color: var(--accent-blue);">${m.reharm}</div>
                        </div>
                    </div>
                    <div class="roman-tag">Roman: ${m.roman}</div>
                `;
                grid.appendChild(card);
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const fileLabel = document.getElementById('fileChosenLabel');
                const statusText = document.getElementById('audioStatusText');
                if (fileLabel) fileLabel.textContent = file.name;
                if (statusText) statusText.textContent = `Loaded file: ${file.name}. Ready for playback.`;
                if (activeAudioElement) { activeAudioElement.pause(); }
                activeAudioElement = new Audio(URL.createObjectURL(file));
            }
        }

        function simulateAudioLoad() {
            const fileLabel = document.getElementById('fileChosenLabel');
            const statusText = document.getElementById('audioStatusText');
            if (fileLabel) fileLabel.textContent = 'Two Friends Together.wav';
            if (statusText) statusText.textContent = 'Demo track loaded successfully. Ready for playback.';
            if (activeAudioElement) { activeAudioElement.pause(); }
            activeAudioElement = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
        }

        function playAudio() {
            if (activeAudioElement) { activeAudioElement.play(); }
            else { alert('Please choose or load an audio file first.'); }
        }

        function stopPlayback() {
            if (activeAudioElement) { activeAudioElement.pause(); activeAudioElement.currentTime = 0; }
        }

        function playChordSequence(isReharm) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const chords = sectionData[currentSection];
            const instrumentElem = document.getElementById('instrumentSelect');
            const voicingElem = document.getElementById('voicingSelect');
            const statusText = document.getElementById('audioStatusText');

            const instrument = instrumentElem ? instrumentElem.value : 'Piano';
            const voicing = voicingElem ? voicingElem.value : 'Neutral';
            let time = audioCtx.currentTime;

            const noteMap = { 'C': 261.63, 'C#': 277.18, 'Db': 277.18, 'D': 293.66, 'D#': 311.13, 'Eb': 311.13, 'E': 329.63, 'F': 349.23, 'F#': 369.99, 'Gb': 369.99, 'G': 392.00, 'G#': 415.30, 'Ab': 415.30, 'A': 440.00, 'A#': 466.16, 'Bb': 466.16, 'B': 493.88 };

            if (!chords) return;

            chords.forEach((c, idx) => {
                let chordStr = isReharm ? c.reharm : c.base;
                if (!chordStr || chordStr === '-') return;

                let rootMatch = chordStr.match(/^[A-G][b#]*/);
                let root = rootMatch ? rootMatch[0] : 'C';
                let freq = noteMap[root] || 261.63;

                let frequencies = [freq, freq * 1.25, freq * 1.5];
                if(chordStr.includes('m')) { frequencies[1] = freq * 1.2; }

                if (voicing === 'Drop 2') {
                    frequencies = [freq * 0.5, freq * 1.5, freq * 2.0, freq * 2.5];
                } else if (voicing === 'Upper Structure') {
                    frequencies = [freq, freq * 1.5, freq * 2.25, freq * 2.8];
                }

                frequencies.forEach(f => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();

                    if (instrument === 'Acoustic Guitar') {
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(0.08, time + (idx * 0.5));
                        gain.gain.exponentialRampToValueAtTime(0.0001, time + (idx * 0.5) + 0.35);
                    } else {
                        osc.type = 'triangle';
                        gain.gain.setValueAtTime(0.12, time + (idx * 0.5));
                        gain.gain.exponentialRampToValueAtTime(0.0001, time + (idx * 0.5) + 0.5);
                    }

                    osc.frequency.setValueAtTime(f, time + (idx * 0.5));
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(time + (idx * 0.5));
                    osc.stop(time + (idx * 0.5) + 0.6);
                });
            });

            if (statusText) {
                statusText.textContent = `Playing [${instrument} / ${voicing}] ${isReharm ? 'Reharmonized' : 'Base'} progression for ${currentSection}...`;
            }
        }

        function playBase() { playChordSequence(false); }
        function playReharm() { playChordSequence(true); }

        function exportWav() { alert('WAV export renderer initialized.'); }
        function exportMultiTrackMidi() { alert('Multi-Track MIDI stems exported successfully! Ready for REAPER.'); }
        function exportMusicXml() { alert('MusicXML score exported successfully.'); }
        function suggestReharm() { alert(`Generated intelligent reharmonization suggestions for ${currentSection}.`); }
        function clearHighlights() { selectedMeasureIndex = null; renderMeasures(); closePalette(); }

        window.onload = function() {
            renderMeasures();
            renderTimeline();
        };
    </script>
